<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>혈당 다이어리 · 디자인 프로토타입</title>
<style>
:root{--green:#28685a;--ink:#1f3731;--muted:#71817b;--bg:#f5f7f3;--line:#e4eae4;--mint:#e8f1eb;--orange:#bb713b}*{box-sizing:border-box}body{margin:0;background:#e9eee8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #b6d8cb;outline-offset:3px}.studio{max-width:1180px;margin:auto;display:grid;grid-template-columns:280px 1fr;gap:65px;padding:50px 32px}.aside{padding-top:25px}.brand{font-size:22px;font-weight:750;letter-spacing:-1px}.brand span{color:var(--green)}.caption{font-size:13px;line-height:1.8;color:var(--muted)}.aside h1{font-size:34px;line-height:1.3;letter-spacing:-1.8px;margin:35px 0 18px}.route{display:block;text-align:left;border:0;background:transparent;padding:14px 15px;border-radius:12px;width:100%;color:var(--muted);margin:3px 0}.route.active{background:var(--green);color:white}.small-label{font-size:11px;letter-spacing:1.6px;color:var(--muted);margin:30px 0 12px}.swatches{display:flex;gap:8px}.swatches span{width:30px;height:30px;border-radius:50%;border:1px solid #d9e2d9}.preview{display:flex;justify-content:center;align-items:flex-start}.phone{position:relative;width:390px;height:810px;border:8px solid #fff;border-radius:42px;background:var(--bg);box-shadow:0 24px 70px #28453620;overflow:hidden}.status{height:43px;padding:14px 24px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700}.island{width:90px;height:24px;border-radius:18px;background:#1e2d26;position:absolute;left:50%;top:8px;transform:translateX(-50%)}.screen{height:calc(100% - 43px);overflow:auto;padding:18px 22px 95px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:12px;color:var(--muted);margin:0 0 7px}h2{font-size:27px;letter-spacing:-1px;line-height:1.3;margin:0 0 20px}h3{font-size:16px;margin:0 0 12px}.circle{border:1px solid var(--line);background:white;width:38px;height:38px;border-radius:50%;font-size:18px}.hero{background:var(--green);color:white;border-radius:23px;padding:22px;margin:17px 0}.hero p{font-size:12px;color:#d3e5dc;margin:0 0 10px}.hero strong{display:block;font-size:23px;line-height:1.5;letter-spacing:-.5px}.hero button{margin-top:18px;background:#fff;color:var(--green);border:0;border-radius:9px;padding:10px 14px;font-size:12px;font-weight:700}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 27px}.action{border:1px solid var(--line);background:white;padding:17px 13px;text-align:left;border-radius:16px;font-size:13px;font-weight:650}.action span{display:block;color:var(--green);font-size:23px;margin-bottom:9px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.section-title h3{margin:0}.section-title small{font-size:11px;color:var(--muted)}.record{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:9px;width:100%;text-align:left;color:var(--ink)}.thumb{display:grid;place-items:center;min-width:44px;height:44px;background:#f3e9df;border-radius:12px;font-size:23px}.record strong{font-size:13px}.record p{font-size:11px;margin:5px 0;color:var(--muted)}.record time{font-size:11px;color:var(--muted);margin-left:auto}.nav{position:absolute;bottom:0;left:0;width:100%;height:78px;display:flex;padding:11px 12px 20px;background:#ffffffed;border-top:1px solid var(--line);backdrop-filter:blur(12px)}.nav button{flex:1;border:0;background:transparent;font-size:10px;color:var(--muted)}.nav span{display:block;font-size:19px;margin-bottom:4px}.nav .selected{color:var(--green);font-weight:700}.primary{display:block;width:100%;background:var(--green);color:white;padding:16px;border:0;border-radius:13px;font-size:14px;font-weight:700;margin-top:20px}.secondary{display:block;width:100%;border:1px solid var(--line);background:white;color:var(--green);padding:14px;border-radius:13px;margin-top:10px;font-size:13px}.back{border:0;background:transparent;color:var(--green);padding:0 0 18px;font-size:13px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}.food-preview{height:210px;position:relative;display:flex;align-items:center;justify-content:center;background:#e8dccd;border-radius:24px;font-size:84px;overflow:hidden}.food-preview img{width:100%;height:100%;object-fit:cover;position:absolute}.food-preview small{position:absolute;left:14px;bottom:13px;font-size:11px;background:#ffffffd9;padding:6px 10px;border-radius:20px}.quantity{display:flex;justify-content:space-between;align-items:center}.stepper{display:flex;align-items:center;gap:15px}.stepper button{border:1px solid var(--line);border-radius:9px;width:33px;height:33px;background:var(--bg);color:var(--green)}.chips{display:flex;gap:7px;flex-wrap:wrap}.chips button{border:1px solid var(--line);border-radius:10px;background:white;color:var(--muted);font-size:12px;padding:10px 13px}.chips .on{background:var(--mint);color:var(--green);border-color:#b7d2c4}.note{background:var(--mint);color:var(--green);font-size:12px;line-height:1.8;border-radius:14px;padding:15px;margin-top:15px}.metrics{display:flex;gap:8px}.metric{flex:1;background:white;border:1px solid var(--line);border-radius:13px;padding:13px 9px}.metric small{display:block;font-size:10px;color:var(--muted);margin-bottom:7px}.metric strong{font-size:19px}.chart{width:100%;height:auto}.chart text{font-size:10px;fill:var(--muted)}.tabs{display:flex;padding:4px;border-radius:11px;background:#e8ece5;margin:4px 0 20px}.tabs button{flex:1;border:0;background:transparent;padding:9px;color:var(--muted);border-radius:8px;font-size:12px}.tabs .on{background:white;color:var(--green);box-shadow:0 2px 4px #00000008}.guide{height:240px;background:#f0f3ec;border-radius:18px;padding:24px;margin:25px 0;display:flex;align-items:center;justify-content:center}.mini-phone{width:140px;height:205px;background:white;border:3px solid #52665c;border-radius:20px;padding:22px 12px}.mini-line{height:8px;background:#dce5dc;border-radius:5px;margin:10px 0}.mini-chart{height:80px;background:var(--mint);border-radius:10px;margin:20px 0}.progress{display:flex;gap:5px;margin:12px 0 28px}.progress span{height:4px;flex:1;background:#dce6dc;border-radius:5px}.progress .done{background:var(--green)}.insulin-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.insulin-row input{width:65px;padding:9px;border:1px solid var(--line);border-radius:9px;text-align:center}.toast{position:absolute;bottom:92px;left:20px;right:20px;border-radius:12px;background:var(--ink);color:white;font-size:12px;padding:14px;text-align:center;z-index:5}.weekbars{display:flex;align-items:flex-end;gap:12px;height:120px;margin:20px 0}.weekbars div{flex:1;text-align:center;font-size:10px;color:var(--muted)}.weekbars i{display:block;background:var(--green);border-radius:5px 5px 0 0;margin-bottom:8px}.demo{font-size:11px;color:var(--muted);text-align:center;margin-top:16px}.photo-input{display:none}.camera{background:#273b32;height:350px;border-radius:25px;display:grid;place-items:center;color:#d7e4da;font-size:13px;position:relative}.focus-frame{position:absolute;inset:50px 28px;border:1px solid #acbcb0;border-radius:20px}.shutter{width:68px;height:68px;display:block;margin:25px auto 0;border:5px solid var(--green);outline:2px solid #ccd9ce;background:white;border-radius:50%}@media(max-width:720px){.studio{display:block;padding:20px 10px}.aside{padding:0 10px 20px}.aside h1,.aside .caption,.small-label,.swatches{display:none}.route{display:inline-block;width:auto;font-size:12px;padding:9px}.brand{margin-bottom:15px}.phone{width:min(390px,100%);height:790px}.preview{width:100%}}@media(max-width:380px){.screen{padding-left:16px;padding-right:16px}.phone{border-width:4px}}
</style></head><body>
<div class="studio"><aside class="aside"><div class="brand"><span>혈당</span> 다이어리<span style="font-size:12px;color:#71817b;margin-left:8px">시안</span></div><h1>기록은 가볍게.<br>하루는 선명하게.</h1><p class="caption">사진과 혈당의 흐름을 함께 보는<br>iOS 앱 디자인 프로토타입</p><nav aria-label="프로토타입 화면"><button class="route active" data-route="home">오늘 · 홈</button><button class="route" data-route="camera">사진으로 기록</button><button class="route" data-route="import">혈당 가져오기</button><button class="route" data-route="report">일일 · 주간 리포트</button><button class="route" data-route="setup">처음 시작하기</button></nav><div class="small-label">DESIGN PALETTE</div><div class="swatches"><span style="background:#28685a" title="메인 초록색"></span><span style="background:#e8f1eb" title="연한 초록색"></span><span style="background:#f5f7f3" title="배경색"></span><span style="background:#bb713b" title="강조색"></span></div><p class="caption" style="margin-top:25px">예시 데이터 · 서버 연결 없음<br>사진은 이 화면에서만 미리 봅니다.</p></aside><main class="preview"><div class="phone"><div class="island"></div><div class="status"><span>9:41</span><span>▰ ▰ ▰</span></div><div class="screen" id="screen"></div><nav class="nav" id="bottom" aria-label="앱 메뉴"></nav><div id="toast" hidden class="toast" role="status"></div></div></main></div>
<script>
(()=>{const screen=document.getElementById('screen'),bottom=document.getElementById('bottom');let page='home',count=3,context='간식',guideStep=0,period='daily',photo='',saved=false,detailTitle='초콜릿 · 3조각',detailSub='간식';const chart=()=>`<svg class="chart" viewBox="0 0 300 175" role="img" aria-label="예시 하루 혈당 곡선, 단위 mg/dL"><rect x="30" y="61" width="260" height="59" fill="#e8f1eb"/><g stroke="#e3e9e2"><path d="M30 25H290M30 61H290M30 120H290M30 145H290"/></g><g><text x="0" y="29">250</text><text x="0" y="65">180</text><text x="6" y="124">70</text><text x="30" y="167">00시</text><text x="92" y="167">06시</text><text x="155" y="167">12시</text><text x="215" y="167">18시</text><text x="269" y="167">24시</text></g><path d="M30 90 C45 97 50 77 64 82 S80 110 95 96 S111 56 126 70 S143 141 154 128 S168 23 184 41 S207 98 222 76 S245 56 256 67 S278 91 290 79" fill="none" stroke="#28685a" stroke-width="2.5"/><circle cx="166" cy="99" r="4" fill="#bb713b"/><text x="173" y="112">記録</text><text x="30" y="12">血糖 mg/dL</text></svg>`.replace('記録','기록').replace('血糖','혈당');
const back=(to='home')=>`<button class="back" data-go="${to}">‹ 돌아가기</button>`;
function render(){document.querySelectorAll('.route').forEach(b=>b.classList.toggle('active',b.dataset.route===page||(page==='food'&&b.dataset.route==='camera')));bottom.innerHTML=[['home','⌂','오늘'],['report','▥','리포트'],['import','↓','혈당'],['setup','⚙','설정']].map(([p,i,t])=>`<button data-go="${p}" class="${page===p?'selected':''}"><span>${i}</span>${t}</button>`).join('');
if(page==='home')screen.innerHTML=`<div class="top"><div><p class="eyebrow">10월 3일 토요일</p><h2 style="margin:0">오늘의 기록</h2></div><button class="circle" data-action="notice" aria-label="알림">♧</button></div><div class="hero"><p>작은 기록이 쌓이는 하루</p><strong>먹은 순간을 남기면<br>혈당의 흐름이 보여요.</strong><button data-go="import">혈당 가져오기 ↗</button></div><div class="actions"><button class="action" data-go="camera"><span>◎</span>먹은 것 찍기</button><button class="action" data-go="insulin"><span>＋</span>인슐린 기록</button></div><div class="section-title"><h3>오늘 남긴 순간</h3><small>${saved?'5':'4'}개의 기록</small></div>${saved?record('🍫','초콜릿 · '+count+'조각','방금 기록했어요','방금'):''}${record('💉','초속효성 · 4단위','인슐린 기록','07:34')}${record('🍚','집밥 · 한 그릇','식사','08:10')}${record('🍫','초콜릿 · 3조각','간식','11:05')}${record('☕','아메리카노 · 한 잔','음료','14:20')}<div class="note">오늘의 혈당을 가져오면 기록한 순간과 혈당 곡선을 함께 볼 수 있어요.</div>`;
if(page==='camera')screen.innerHTML=`${back()}<p class="eyebrow">사진으로 남기는 순간</p><h2>먹기 전에<br>한 장만 찍어주세요.</h2><div class="camera"><div class="focus-frame"></div><span>음식이 화면 안에 들어오도록</span></div><button class="shutter" data-action="sample" aria-label="예시 사진으로 촬영 체험"></button><p class="demo">촬영 버튼은 예시 음식으로 진행해요.</p><button class="secondary" data-action="upload">내 사진 선택하기</button><input id="photo" class="photo-input" type="file" accept="image/*"><p class="demo">내 사진도 실제 AI 분석 없이 예시 결과를 표시해요.</p>`;
if(page==='food')screen.innerHTML=`${back('camera')}<p class="eyebrow">인식 결과 확인 · 예시</p><h2>이렇게 드셨나요?</h2><div class="food-preview">🍫${photo?'<img src="'+photo+'" alt="선택한 음식 사진">':''}<small>사진 인식 결과 · 예시 데이터</small></div><div class="card"><div class="quantity"><div><h3 style="margin:0">초콜릿</h3><p class="eyebrow" style="margin-top:7px">조각 수를 확인해주세요</p></div><div class="stepper"><button data-action="minus" aria-label="개수 줄이기">−</button><strong id="count">${count}</strong><button data-action="plus" aria-label="개수 늘리기">＋</button></div></div></div><h3 style="margin-top:24px">어떤 상황이었나요?</h3><div class="chips">${['식사','간식','저혈당','음료','술'].map(c=>`<button class="${context===c?'on':''}" data-context="${c}" aria-pressed="${context===c}">${c}</button>`).join('')}</div><div class="note">사진만으로 먹은 양을 정확히 알기 어려워요. 이름과 개수를 확인한 뒤 저장해주세요.</div><button class="primary" data-action="save">맞아요, 저장</button><button class="secondary" data-go="camera">다시 선택하기</button>`;
if(page==='insulin')screen.innerHTML=`${back()}<p class="eyebrow">인슐린 기록</p><h2>투여한 내용을<br>남겨주세요.</h2><div class="card"><label for="dose">초속효성 인슐린</label><div class="insulin-row"><span>투여량</span><div><input id="dose" type="number" min="1" max="100" value="4" aria-label="투여량"> 단위</div></div><p class="caption">실제 투여한 양을 기록하는 화면입니다.</p></div><button class="primary" data-action="insulin-save">기록 저장</button>`;
if(page==='import'){const titles=['리브레 앱에서<br>메뉴를 열어주세요.','보고서에서<br>일일 그래프를 골라요.','공유를 누르고<br>우리 앱을 선택해요.'];screen.innerHTML=`${back()}<div class="progress">${[0,1,2].map(i=>`<span class="${i<=guideStep?'done':''}"></span>`).join('')}</div><p class="eyebrow">혈당 가져오기 · ${guideStep+1} / 3</p><h2>${titles[guideStep]}</h2><p class="caption">${['리브레 앱의 공유 기능으로 혈당 기록을 가져옵니다.','가져오려는 날짜의 그래프를 선택해주세요.','공유 목록에서 앱을 선택하면 가져오기가 시작됩니다.'][guideStep]}</p><div class="guide"><div class="mini-phone"><div style="font-size:12px;color:#28685a">${['☰ 메뉴','일일 그래프','공유하기 ↗'][guideStep]}</div><div class="mini-line"></div><div class="mini-chart"></div><div class="mini-line"></div></div></div><p class="caption">리브레 실제 화면 캡처로 교체할 안내 예시입니다.</p><button class="primary" data-action="guide-next">${guideStep===2?'가져오기 체험':'다음'}</button>${guideStep>0?'<button class="secondary" data-action="guide-prev">이전</button>':''}`;}
if(page==='import-done')screen.innerHTML=`${back()}<div style="font-size:45px;color:var(--green);margin-top:35px">✓</div><h2 style="margin-top:20px">혈당을 가져왔어요.</h2><p class="caption">프로토타입의 가져오기 완료 예시예요.</p><div class="card"><h3>10월 3일 혈당 기록</h3><p class="caption">하루 곡선과 기록을 함께 볼 준비가 됐어요.</p>${chart()}</div><button class="primary" data-go="report">오늘 리포트 보기</button>`;
if(page==='report')screen.innerHTML=`<p class="eyebrow">기록을 연결해 보는 시간</p><h2>나의 혈당 이야기</h2><div class="tabs"><button data-period="daily" class="${period==='daily'?'on':''}">일일 리포트</button><button data-period="weekly" class="${period==='weekly'?'on':''}">주간 리포트</button></div>${period==='daily'?`<h3>10월 3일 토요일</h3><div class="metrics"><div class="metric"><small>목표 범위 안</small><strong>74%</strong></div><div class="metric"><small>평균 혈당</small><strong>141</strong></div><div class="metric"><small>남긴 기록</small><strong>${saved?5:4}개</strong></div></div><div class="card">${chart()}<p class="demo">예시 혈당 데이터</p></div><div class="section-title"><h3>곡선 위의 순간</h3><small>눌러서 자세히</small></div>${record('🍫','11:05 · 초콜릿 3조각','섭취 전후 혈당 살펴보기','›')}<div class="note">숫자와 기록을 함께 보며 하루의 패턴을 살펴보세요.</div>`:`<h3>9월 27일 — 10월 3일</h3><div class="hero"><p>이번 주 목표 범위 안 · 예시</p><strong>86%<span style="font-size:13px;margin-left:10px">의 시간</span></strong></div><div class="card"><h3>일주일의 흐름</h3><div class="weekbars">${[78,90,83,88,92,81,86].map((v,i)=>`<div><i style="height:${v}px"></i>${['일','월','화','수','목','금','토'][i]}<br>${v}%</div>`).join('')}</div></div><div class="card"><h3>기록이 잘 이어진 날</h3><p class="caption">식사와 인슐린 기록이 함께 남아 있어 혈당 변화의 순서를 살펴보기 쉬웠어요.</p></div><div class="note">다음 주에도 먹은 순간을 사진으로 남겨보세요.</div>`}`;
if(page==='detail')screen.innerHTML=`${back('report')}<p class="eyebrow">기록 상세 · 예시</p><h2>${detailTitle}</h2><div class="card">${chart()}</div><div class="card"><h3>이 순간의 기록</h3><div class="insulin-row"><span>기록</span><strong>${detailTitle}</strong></div><div class="insulin-row"><span>상황</span><strong>${detailSub}</strong></div></div><div class="note">이 화면은 기록 전후의 혈당을 함께 보여주는 디자인 예시예요.</div>`;
if(page==='setup')screen.innerHTML=`<p class="eyebrow">처음 시작하기</p><h2>평소 사용하는<br>인슐린을 알려주세요.</h2><p class="caption">자주 쓰는 기록 버튼을 준비할게요.</p><div class="card"><h3>연속혈당측정기</h3><div class="insulin-row"><span>FreeStyle Libre</span><span style="color:var(--green)">선택됨</span></div></div><div class="card"><h3>인슐린 기록 프리셋</h3>${[['아침 · 초속효성',4],['저녁 · 초속효성',5],['지속형',6]].map(([n,v])=>`<div class="insulin-row"><span>${n}</span><div><input type="number" value="${v}" min="1" max="100" aria-label="${n} 단위"> 단위</div></div>`).join('')}</div><div class="note">이 값은 빠른 기록을 위한 설정이에요. 투여량을 추천하는 기능은 아닙니다.</div><button class="primary" data-go="import">다음 · 혈당 가져오기</button>`;
screen.scrollTop=0;}
function record(icon,title,sub,time){return `<button class="record" data-go="detail" data-title="${title}" data-sub="${sub}"><span class="thumb">${icon}</span><div><strong>${title}</strong><p>${sub}</p></div><time>${time}</time></button>`}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.hidden=true,2400)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go==='detail'){detailTitle=b.dataset.title;detailSub=b.dataset.sub;}if(b.dataset.go||b.dataset.route){page=b.dataset.go||b.dataset.route;render();return}if(b.dataset.context){context=b.dataset.context;render();return}if(b.dataset.period){period=b.dataset.period;render();return}switch(b.dataset.action){case'sample':photo='';page='food';render();break;case'upload':document.getElementById('photo').click();break;case'plus':count=Math.min(99,count+1);document.getElementById('count').textContent=count;break;case'minus':count=Math.max(1,count-1);document.getElementById('count').textContent=count;break;case'save':saved=true;page='home';render();toast('초콜릿 '+count+'조각을 기록했어요');break;case'insulin-save':if(!document.getElementById('dose').checkValidity()){document.getElementById('dose').reportValidity();break}page='home';render();toast('인슐린 기록 저장 체험이 완료됐어요');break;case'guide-next':if(guideStep<2)guideStep++;else page='import-done';render();break;case'guide-prev':guideStep=Math.max(0,guideStep-1);render();break;case'notice':toast('새로운 알림이 없어요');break}});
document.addEventListener('change',e=>{if(e.target.id==='photo'&&e.target.files[0]){if(photo)URL.revokeObjectURL(photo);photo=URL.createObjectURL(e.target.files[0]);page='food';render();}});render();})();
</script></body></html>
