<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>혈당 다이어리 · 홈 화면 시안 3종</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e7e9e6;color:#222;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif}
button{font:inherit;cursor:pointer;color:inherit;border:0;background:none;padding:0;text-align:left}
button:focus-visible{outline:3px solid #f0a35e;outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.studio{max-width:1100px;margin:auto;padding:28px 20px 40px;display:grid;grid-template-columns:300px 1fr;gap:48px}
.side h1{font-size:24px;letter-spacing:-.04em;margin:0 0 6px}
.side p{font-size:14px;line-height:1.7;color:#555;margin:0 0 18px}
.sw{display:block;width:100%;padding:14px 16px;border-radius:14px;border:2px solid transparent;background:#fff;margin-bottom:10px}
.sw b{display:block;font-size:16px}.sw span{font-size:13px;color:#666;line-height:1.5}
.sw.on{border-color:#1f5f52;box-shadow:0 4px 14px #0001}
.pal{display:flex;gap:6px;margin:8px 0 0}.pal i{width:22px;height:22px;border-radius:50%;border:1px solid #0002}
.rules{font-size:13px;line-height:1.7;color:#555;background:#fff;border-radius:14px;padding:14px 16px}
.stage{display:flex;justify-content:center}
.phone{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;box-shadow:0 0 0 9px #17191a,0 30px 70px #0004;flex:none}
.status{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 8px;font-size:15px;font-weight:700;z-index:3}
.island{position:absolute;top:11px;left:50%;width:110px;height:32px;margin-left:-55px;border-radius:20px;background:#000;z-index:4}
.scroll{position:absolute;inset:0;overflow:auto;padding:62px 20px 110px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.nav{position:absolute;left:0;right:0;bottom:0;height:88px;display:flex;padding:8px 10px 26px;z-index:3}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;min-height:52px}
.toast{position:absolute;left:20px;right:20px;bottom:100px;background:#222;color:#fff;font-size:14px;line-height:1.5;padding:14px 16px;border-radius:14px;z-index:6;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:none}
.demo{font-size:13px;font-weight:600}
@media(max-width:820px){.studio{display:block}.side{margin-bottom:24px}.phone{margin:auto}}

/* ===== A. 차분하고 신뢰감 ===== */
.A{background:#eef3f1;color:#17332d}
.A .status,.A .nav{color:#17332d}
.A .nav{background:#fffffff2;border-top:1px solid #dbe5e1}
.A .nav button{color:#6b7f79}.A .nav .sel{color:#1f6355}
.A .nav .sel svg{background:#dcece7;border-radius:12px;width:48px;height:30px;padding:3px 12px}
.A .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.A .date{font-size:14px;color:#5b706a;margin:0 0 4px}
.A h2{margin:0;font-size:28px;letter-spacing:-.04em}
.A .bell{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 8px #1f63550f}
.A .chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #cfdcd7;color:#4a625b;border-radius:99px;padding:6px 12px;margin-bottom:14px}
.A .chip:before{content:"";width:8px;height:8px;border-radius:50%;background:#d98a3d}
.A .hero{background:linear-gradient(150deg,#1f6355,#174a41);color:#fff;border-radius:26px;padding:22px;box-shadow:0 12px 26px #1f635533}
.A .hero p{margin:0 0 8px;font-size:14px;color:#cfe6df}
.A .hero strong{display:block;font-size:22px;line-height:1.45;letter-spacing:-.03em;font-weight:700}
.A .hero .cta{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:#174a41;border-radius:16px;height:52px;font-size:16px;font-weight:700;width:100%}
.A .acts{display:grid;grid-template-columns:1.15fr 1fr;gap:12px;margin:14px 0 26px}
.A .act{background:#fff;border-radius:22px;padding:16px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2px 10px #1f63550d;font-size:17px;font-weight:700}
.A .act .ic{width:44px;height:44px;border-radius:14px;background:#e1efea;color:#1f6355;display:grid;place-items:center}
.A .act.main{background:#e3f0ec;border:1.5px solid #9cc5b9}.A .act.main .ic{background:#1f6355;color:#fff}
.A .sec{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 12px}
.A .sec h3{margin:0;font-size:19px;letter-spacing:-.03em}.A .sec span{font-size:14px;color:#5b706a}
.A .list{background:#fff;border-radius:22px;box-shadow:0 2px 10px #1f63550d;overflow:hidden}
.A .rec{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;min-height:72px}
.A .rec+.rec{border-top:1px solid #e6eeeb}
.A .rec .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#e8f1ee;color:#1f6355}
.A .rec .ic.ins{background:#f8ead9;color:#a5601f}
.A .rec b{display:block;font-size:16px}.A .rec small{display:block;font-size:14px;color:#5b706a;margin-top:2px}
.A .rec time{margin-left:auto;font-size:15px;font-weight:600;color:#3d554e;font-variant-numeric:tabular-nums}
.A .note{margin:16px 4px 0;font-size:14px;line-height:1.65;color:#4a625b;display:flex;gap:10px}
.A .note svg{color:#1f6355;margin-top:2px}

/* ===== B. 여백과 글자 ===== */
.B{background:#fbfaf7;color:#16140f}
.B .status,.B .nav{color:#16140f}
.B .nav{background:#fbfaf7f5;border-top:1px solid #e3e0d6}
.B .nav button{color:#8a867a}.B .nav .sel{color:#16140f}
.B .nav .sel span{border-bottom:2px solid #1d5b4a;padding-bottom:2px}
.B .scroll{padding:62px 28px 110px}
.B .head{display:flex;justify-content:space-between;align-items:flex-start}
.B .date{font-size:15px;color:#7a766a;margin:14px 0 6px}
.B h2{margin:0;font-size:38px;line-height:1.15;letter-spacing:-.05em;font-weight:800}
.B .bell{width:48px;height:48px;display:grid;place-items:center;margin:4px -12px 0 0}
.B .chip{display:block;font-size:13px;color:#7a766a;margin:14px 0 30px;letter-spacing:.01em}
.B .hero{padding:22px 0;border-top:2px solid #16140f}
.B .hero p{margin:0 0 10px;font-size:14px;color:#1d5b4a;font-weight:700}
.B .hero strong{display:block;font-size:24px;line-height:1.4;letter-spacing:-.045em;font-weight:700}
.B .hero .cta{margin-top:16px;display:inline-flex;align-items:center;gap:8px;font-size:17px;font-weight:700;color:#1d5b4a;border-bottom:2px solid #1d5b4a;padding:12px 0 6px;min-height:48px}
.B .acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 38px}
.B .act{display:flex;align-items:center;justify-content:center;gap:10px;height:60px;border-radius:99px;font-size:17px;font-weight:700;border:1.5px solid #16140f}
.B .act.main{background:#16140f;color:#fbfaf7}
.B .sec{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:1px solid #16140f}
.B .sec h3{margin:0;font-size:18px;letter-spacing:-.03em}.B .sec span{font-size:14px;color:#7a766a}
.B .rec{display:grid;grid-template-columns:54px 1fr 24px;align-items:center;gap:6px;width:100%;padding:16px 0;min-height:76px;border-bottom:1px solid #e3e0d6}
.B .rec .ic{display:none}
.B .rec time{grid-column:1;grid-row:1;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:#7a766a}
.B .rec .tx{grid-column:2}.B .rec b{display:block;font-size:17px;letter-spacing:-.02em}
.B .rec small{font-size:14px;color:#7a766a}
.B .rec:after{content:"";grid-column:3;width:8px;height:8px;border-top:1.8px solid #aaa597;border-right:1.8px solid #aaa597;transform:rotate(45deg);justify-self:end}
.B .note{margin:22px 0 0;font-size:14px;line-height:1.7;color:#7a766a}.B .note svg{display:none}

/* ===== C. 따뜻한 다이어리 ===== */
.C{background:#fbf1e1;color:#4a3426;background-image:repeating-linear-gradient(transparent 0 31px,#f0e0c7 31px 32px)}
.C .status,.C .nav{color:#4a3426}
.C .nav{background:#fff8ec;border-top:2px dashed #e6cfa9}
.C .nav button{color:#9b8168}.C .nav .sel{color:#b4562c}
.C .nav .sel svg{background:#ffe3cf;border-radius:50%;width:40px;height:30px;padding:3px 8px}
.C .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.C .date{font-size:15px;color:#a0714f;margin:0 0 2px;font-weight:700}
.C h2{margin:0;font-size:29px;letter-spacing:-.03em;font-family:'Gowun Batang','Batang','Noto Serif KR',serif;font-weight:800}
.C .bell{width:48px;height:48px;border-radius:16px;background:#fff8ec;border:2px solid #4a3426;display:grid;place-items:center;box-shadow:2px 3px 0 #4a3426}
.C .chip{display:inline-block;background:#fff3b8;border-radius:6px;padding:5px 10px;transform:rotate(-1.5deg);margin-bottom:16px}
.C .hero{position:relative;background:#fffdf6;border:2px solid #4a3426;border-radius:20px;padding:24px 20px 20px;box-shadow:4px 5px 0 #e3b98a;margin-top:10px}
.C .hero:before{content:"";position:absolute;top:-12px;left:50%;width:84px;height:24px;margin-left:-42px;background:#f4c58c;opacity:.9;transform:rotate(-3deg);border-radius:3px}
.C .hero p{margin:0 0 8px;font-size:15px;color:#b4562c;font-weight:700}
.C .hero strong{display:block;font-size:22px;line-height:1.5;font-family:'Gowun Batang','Batang',serif}
.C .hero .cta{margin-top:16px;display:inline-flex;align-items:center;gap:8px;background:#fff;border:2px solid #4a3426;border-radius:14px;height:48px;padding:0 16px;font-size:16px;font-weight:700}
.C .acts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:26px 0 26px}
.C .act{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border:2px solid #4a3426;border-radius:22px;font-size:17px;font-weight:800;background:#ffd9c2;box-shadow:3px 4px 0 #4a3426;text-align:center}
.C .act .ic{width:48px;height:48px;border-radius:50%;background:#fff8ec;display:grid;place-items:center;border:2px solid #4a3426}
.C .act:nth-child(2){background:#d8e7c6}
.C .sec{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.C .sec h3{margin:0;font-size:20px;font-family:'Gowun Batang','Batang',serif}.C .sec span{font-size:14px;color:#a0714f;font-weight:700}
.C .list{position:relative;padding-left:14px}
.C .list:before{content:"";position:absolute;left:5px;top:10px;bottom:10px;border-left:2px dotted #c9a57c}
.C .rec{position:relative;display:flex;align-items:center;gap:12px;width:100%;background:#fffdf6;border:1.5px solid #e3c9a3;border-radius:18px;padding:12px;margin-bottom:12px;min-height:72px}
.C .rec:before{content:"";position:absolute;left:-14px;top:50%;margin-top:-6px;width:12px;height:12px;border-radius:50%;background:#e7855a;border:2px solid #fbf1e1}
.C .rec .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#ffe9b8;color:#4a3426}
.C .rec:nth-child(2) .ic{background:#d8e7c6}.C .rec:nth-child(3) .ic{background:#ffd9c2}.C .rec:nth-child(4) .ic{background:#e6d5f0}
.C .rec b{display:block;font-size:16px}.C .rec small{font-size:14px;color:#8c6f56}
.C .rec time{margin-left:auto;font-size:14px;font-weight:800;background:#fbf1e1;border-radius:10px;padding:5px 9px;font-variant-numeric:tabular-nums}
.C .note{margin-top:8px;background:#fff3b8;border-radius:6px;padding:14px 16px;font-size:14px;line-height:1.65;transform:rotate(.6deg);display:block}
.C .note svg{display:none}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="cam" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.2"/></symbol>
<symbol id="syr" viewBox="0 0 24 24"><path d="M15.5 3.5l5 5M13 6l5 5-9 9H4v-5zM8.5 12.5l2 2M11 10l2 2"/></symbol>
<symbol id="imp" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></symbol>
<symbol id="bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0112 0v5l1.5 2h-15zM10 21h4"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4zM10 20v-6h4v6"/></symbol>
<symbol id="chart" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></symbol>
<symbol id="drop" viewBox="0 0 24 24"><path d="M12 3.5s6 6.2 6 10.5a6 6 0 01-12 0c0-4.300 6-10.500 6-10.500z"/></symbol>
<symbol id="set" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></symbol>
<symbol id="bowl" viewBox="0 0 24 24"><path d="M3.5 11h17a8.5 8.5 0 01-17 0zM8 7.500c0-1.500 1-1.500 1-3M13 7.500c0-1.500 1-1.500 1-3"/></symbol>
<symbol id="choc" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM5 9.500h14M5 14.500h14M12 4v16"/></symbol>
<symbol id="cup" viewBox="0 0 24 24"><path d="M5 9h11v6a4 4 0 01-4 4H9a4 4 0 01-4-4zM16 10h1.500a2.500 2.500 0 010 5H16M8 3.500v2M12 3.500v2"/></symbol>
<symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
</defs></svg>

<div class="studio">
<aside class="side">
<h1>혈당 다이어리 · 홈</h1>
<p>같은 내용·같은 기능, 세 가지 표현. 시안을 눌러 비교하세요. (키보드 1·2·3)</p>
<button class="sw on" data-t="A"><b>A · 차분하고 신뢰감</b><span>깊은 초록 히어로, 부드러운 카드, 아이콘 타일로 행동을 분명하게</span><div class="pal"><i style="background:#1f6355"></i><i style="background:#eef3f1"></i><i style="background:#d98a3d"></i></div></button>
<button class="sw" data-t="B"><b>B · 여백과 글자</b><span>카드 없이 선과 큰 제목, 시간표 같은 목록. 색은 초록 한 가지만</span><div class="pal"><i style="background:#16140f"></i><i style="background:#fbfaf7"></i><i style="background:#1d5b4a"></i></div></button>
<button class="sw" data-t="C"><b>C · 따뜻한 다이어리</b><span>줄 노트 배경, 테이프·메모지, 타임라인 점으로 일기장처럼</span><div class="pal"><i style="background:#e7855a"></i><i style="background:#fbf1e1"></i><i style="background:#d8e7c6"></i></div></button>
<div class="rules">공통 유지: 날짜·알림, 혈당 가져오기, 먹은 것 찍기, 인슐린 기록, 오늘 남긴 순간 4개, 하단 4메뉴.<br>본문 최소 14px, 버튼 높이 48px 이상. 모든 데이터는 예시이며 실시간 혈당·진단·용량 추천은 없습니다.</div>
</aside>
<main class="stage"><div class="phone" id="phone"><div class="island"></div><div class="status"><span>9:41</span><span>●●● ▰</span></div><div class="scroll" id="scr"></div><nav class="nav" id="nav" aria-label="앱 메뉴"></nav><div class="toast" id="toast" role="status"></div></div></main>
</div>
<script>
const ic=n=>`<svg class="i" aria-hidden="true"><use href="#${n}"/></svg>`;
const recs=[['syr','초속효성 · 4단위','인슐린 기록','07:34'],['bowl','집밥 · 한 그릇','식사','08:10'],['choc','초콜릿 · 3조각','간식','11:05'],['cup','아메리카노 · 한 잔','음료','14:20']];
const R=recs.map(([i,t,s,tm])=>`<button class="rec" data-m="${t} 기록 상세"><span class="ic ${i==='syr'?'ins':''}">${ic(i)}</span><span class="tx"><b>${t}</b><small>${s}</small></span><time>${tm}</time></button>`).join('');
const nav=[['home','오늘'],['chart','리포트'],['drop','혈당'],['set','설정']].map(([i,t],k)=>`<button class="${k?'':'sel'}" data-m="${t} 화면으로 이동"><span style="display:flex">${ic(i)}</span><span>${t}</span></button>`).join('');
const top=`<div class="head"><div><p class="date">10월 3일 토요일</p><h2>오늘의 기록</h2></div><button class="bell" data-m="알림" aria-label="알림">${ic('bell')}</button></div><span class="chip demo">예시 데이터 · 실제 혈당이 아니에요</span>`;
const hero=`<section class="hero"><p>작은 기록이 쌓이는 하루</p><strong>먹은 순간을 남기면<br>혈당의 흐름이 보여요.</strong><button class="cta" data-m="혈당 가져오기">${ic('imp')}혈당 가져오기</button></section>`;
const acts=`<div class="acts"><button class="act main" data-m="먹은 것 찍기"><span class="ic">${ic('cam')}</span>먹은 것 찍기</button><button class="act" data-m="인슐린 기록"><span class="ic">${ic('syr')}</span>인슐린 기록</button></div>`;
const sec=`<div class="sec"><h3>오늘 남긴 순간</h3><span>4개의 기록</span></div>`;
const note=`<p class="note">${ic('info')}<span>오늘의 혈당을 가져오면 기록한 순간과 혈당 곡선을 함께 볼 수 있어요.</span></p>`;
const L={A:top+hero+acts+sec+`<div class="list">${R}</div>`+note,
B:top+hero+acts+sec+`<div>${R}</div>`+note,
C:top+hero+acts+sec+`<div class="list">${R}</div>`+note};
// B: hero order stays same; C: same
const phone=document.getElementById('phone'),scr=document.getElementById('scr'),nv=document.getElementById('nav'),toast=document.getElementById('toast');
let tt;
function show(m){toast.textContent=m+' — 시안 비교용이라 이동하지 않아요';toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),1800)}
function set(t){phone.className='phone '+t;scr.innerHTML=L[t];nv.innerHTML=nav;scr.scrollTop=0;
document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
document.addEventListener('click',e=>{const s=e.target.closest('.sw');if(s)return set(s.dataset.t);const m=e.target.closest('[data-m]');if(m)show(m.dataset.m)});
document.addEventListener('keydown',e=>{const k={1:'A',2:'B',3:'C'}[e.key];if(k)set(k)});
set('A');
</script></body></html>
